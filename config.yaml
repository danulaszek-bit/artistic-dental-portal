# ============================================================
# Artistic Dental Studio — Pipeline Configuration
# ============================================================

# --- Data Source --------------------------------------------
data_source:
  mode: csv                          # "csv" | "odbc"
  csv:
    watch_folder: "C:/MT_Reports_Local"
    sales_file: "Sales_Data.csv"
    active_cases_file: "Active_30_day.csv"
    wip_cases_file: "WIP_cases.csv"
    case_location_file: "case_location.csv"
    remake_reasons_file: "remake_reasons.csv"
    remake_by_lab_file: "Remake by Lab Customer Products.csv"
    tech_productivity_file: "tech_productivity.csv"
    employee_productivity_file: "EmployeeProductivity.xls"
    prod_by_dept_file: "prod_by_dept.xls"
    all_cases_daily_file: "AllCasesByDateIn.csv"
    remakes_daily_file: "Remakes.csv"
    encoding: "utf-8-sig"

  # --- Phase 2: swap mode to "odbc" when ready -------------
  odbc:
    dsn: "MagicTouchDSN"
    driver: "{ODBC Driver 17 for SQL Server}"
    server: "localhost\\SQLEXPRESS"
    database: "MagicTouchDB"
    trusted_connection: "yes"

# --- Google Drive -------------------------------------------
google_drive:
  credentials_file: "credentials.json"
  token_file: "token.pickle"
  folder_id: "17xL2IX7CT3vJpwid2FI1ssgijVHDR0cD"
  upload_folder_name: "ArtisticDental_Pipeline"

# --- Schedule -----------------------------------------------
schedule:
  run_time: "06:00"
  timezone: "America/Chicago"

# --- Business Targets ---------------------------------------
targets:
  annual_growth_pct: 7.0
  pareto_threshold: 0.80
  remake_alert_pct: 5.0
  implant_turnaround_days: 14

# --- Output -------------------------------------------------
output:
  local_cache_dir: "cache"
  processed_filename: "dental_data_{date}.xlsx"
  log_file: "pipeline.log"
